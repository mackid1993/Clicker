# SPDX-License-Identifier: MIT
#
# Clicker - an unofficial, native client for Channels DVR
# Copyright (c) 2026 David Brustein
#
# Builds the Linux packages: a .deb per architecture, installed and in the
# menu.
#
# This was a Flatpak, then an AppImage, and both are gone for reasons worth
# keeping.
#
# The Flatpak went because it does not use the machine's graphics stack. It
# brings its own Mesa and its own libwayland and reaches the GPU through
# matched driver extensions, and when the match fails it renders in software
# without saying so. Measured on one machine from one commit: the native
# binary was perfect; the Flatpak tore constantly and lost the mouse pointer.
#
# The AppImage went because of how it meets a person. A browser download has
# no execute bit, and even after `chmod +x` the GNOME file manager refuses to
# launch a binary on a double click — "Run as a Program" from a context menu
# is the only door. No menu entry and no icon until something integrates it.
# Every one of those is the format rather than the application, and nothing
# shipped inside the file can change any of them.
#
# A .deb is installed: double-clicked or `apt install ./clicker.deb`, then it
# is in the menu with its icon, and `apt remove clicker` takes it away.
#
# For everything that is not Debian-shaped — Fedora, Arch, openSUSE, anything
# — there is the source path, which is also one line:
#
#   curl -fsSL https://raw.githubusercontent.com/mackid1993/Clicker/main/install.sh | bash
#
# libmpv IS bundled, from scripts/build-mpv.sh — FFmpeg and mpv from their
# pinned tags, LGPL only, exactly as the Windows installer carries them.
# Nothing comes from the distribution: a distribution's FFmpeg is frequently
# GPL, and an application that needs a package installed before it will start
# is not one you can hand to anybody.
#
# What is deliberately NOT bundled is anything to do with graphics — Mesa,
# libwayland, libGL, libva, the cursor theme. Those come from the machine,
# which is the whole difference between this and the Flatpak that tore and
# lost its pointer.
#
# Built on 22.04 deliberately: a binary cannot run on a glibc older than the
# one it was compiled against, and 22.04 reaches back far enough to cover
# anything current.

name: Build Linux

on:
  # Dispatch to get a package to try; workflow_call is how the Release
  # workflow asks for one. Never on a push.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp the build with, e.g. 1.1.7"
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        required: true
        type: string

permissions:
  contents: read

jobs:
  deb:
    # Both architectures a Linux desktop is actually built on, each compiled
    # natively on its own runner.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
            debarch: amd64
          - runner: ubuntu-22.04-arm
            arch: aarch64
            debarch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the version is a version
        env:
          RAW_VERSION: ${{ inputs.version }}
        run: |
          V="$(echo "$RAW_VERSION" | xargs)"
          if ! echo "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "version '$V' is not major.minor.patch" >&2
            exit 1
          fi
          echo "VERSION=$V" >> "$GITHUB_ENV"

      - name: Stamp the version
        run: |
          sed -i "0,/^version = \".*\"/s//version = \"${VERSION}\"/" Cargo.toml
          cargo update --package clicker --precise "${VERSION}" 2>/dev/null || true

      - name: Update Rust
        run: rustup update stable --no-self-update

      # What tray-icon's menu crate and the folder picker compile against,
      # what FFmpeg needs to offer hardware decoding, dpkg-dev for the package
      # itself, and the three audio stacks mpv can output through.
      #
      # The audio headers are not optional. mpv compiles every output
      # conditionally and says nothing when it compiles none, so without them
      # the build succeeds and ships a player that renders video in silence.
      #
      # Headers, not shipped libraries. libva and libvdpau in particular are
      # deliberately NOT bundled: hardware decoding talks to the machine's own
      # driver, so the machine's own libva has to be the one that loads — the
      # same reason Mesa and libwayland are left alone.
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxdo-dev libayatana-appindicator3-dev \
            libgl1-mesa-dev pkg-config meson ninja-build nasm \
            libfreetype6-dev libfribidi-dev libharfbuzz-dev libfontconfig1-dev \
            libunibreak-dev python3-setuptools python3-pip autoconf automake libtool \
            libva-dev libvdpau-dev patchelf dpkg-dev \
            libasound2-dev libpulse-dev libpipewire-0.3-dev
          # 22.04 ships meson 0.61 and libplacebo wants 0.63 or newer. From
          # pip rather than a newer distribution, because the point of
          # building on 22.04 is its old glibc.
          sudo pip3 install --upgrade meson

      # The staged libmpv, cached whole, keyed on the tags and the licensing
      # flags rather than on the file that mentions them — the same
      # arrangement the Windows and macOS jobs use.
      - name: Work out the libmpv cache key
        id: mpvkey
        run: |
          # The audio options are in here deliberately. They were not, and a
          # cached libmpv with no audio output would have survived the commit
          # that fixed it — the flags changed, the key did not, and CI would
          # have restored the mute build and shipped it again.
          #
          # Comments stripped first. Keyed on the raw file, a sentence that
          # happened to mention the gpl option changed the key and rebuilt
          # FFmpeg and mpv on every runner to prove that a comment had
          # changed. Only the tags and the flags decide whether a staged
          # build can be reused, so only code is hashed.
          FINGERPRINT=$(sed 's/#.*//' scripts/build-mpv.sh \
            | grep -E '^(FFMPEG_TAG|MPV_TAG|LIBASS_TAG|LIBPLACEBO_TAG)=|disable-gpl|Dgpl=|enable-vaapi|enable-videotoolbox|Dalsa=|Dpulse=|Dpipewire=|Dcoreaudio=' \
            | (shasum -a 256 2>/dev/null || sha256sum) | cut -c1-16)
          echo "key=$FINGERPRINT" >> "$GITHUB_OUTPUT"
          echo "libmpv cache fingerprint: $FINGERPRINT"

      - name: Cache libmpv
        id: mpv
        uses: actions/cache@v4
        with:
          path: third_party
          key: ${{ matrix.arch }}-mpv-${{ steps.mpvkey.outputs.key }}

      - name: Build libmpv and FFmpeg (LGPL)
        if: steps.mpv.outputs.cache-hit != 'true'
        run: ./scripts/build-mpv.sh

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ matrix.arch }}-cargo-deb-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.arch }}-cargo-deb-

      - name: Build the .deb
        run: ./scripts/build-deb.sh

      # Read back out of the package rather than trusting the script that
      # wrote it: that the files landed where the desktop looks for them, and
      # that the dependency line is not empty. A package that installs and
      # then will not start is worse than one that fails to build.
      - name: Check the package
        run: |
          DEB="target/deb/clicker_${VERSION}_${{ matrix.debarch }}.deb"
          dpkg-deb --info "$DEB"
          echo "--- where things landed ---"
          dpkg-deb --contents "$DEB" \
            | grep -E "usr/bin/clicker|applications/|icons/hicolor|lib/clicker/libmpv"
          dpkg-deb --field "$DEB" Depends | grep -q . \
            || { echo "the package declares no dependencies" >&2; exit 1; }

      - name: Upload the package
        uses: actions/upload-artifact@v4
        with:
          name: linux-deb-${{ matrix.debarch }}
          path: target/deb/clicker_${{ env.VERSION }}_${{ matrix.debarch }}.deb
          if-no-files-found: error
          retention-days: 30
