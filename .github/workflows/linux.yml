# SPDX-License-Identifier: MIT
#
# Clicker - an unofficial, native client for Channels DVR
# Copyright (c) 2026 David Brustein
#
# Builds the Linux AppImage: one file, made executable, double-clicked.
#
# This was a Flatpak first, and the Flatpak is why it is not one now. A
# Flatpak does not use the system's graphics stack — it brings its own Mesa
# and its own libwayland and reaches the GPU through matched driver
# extensions — and when that match fails it falls back to software rendering
# without saying so. Measured on one machine from one commit: the native
# binary was perfect; the Flatpak tore constantly and lost the mouse pointer.
# An AppImage is not a sandbox. It is the binary, in a squashfs, with a
# launcher, using the host's drivers, the host's compositor libraries and the
# host's cursor theme.
#
# The manifest under packaging/flatpak is kept rather than deleted. Flathub is
# how Linux users find things, and the sandbox deserves another attempt on
# hardware somebody can actually test on.
#
# libmpv is not bundled — it is loaded by name at runtime, so the system's own
# copy is used, matching the system's FFmpeg and video drivers:
#
#   sudo apt install libmpv2      (Debian, Ubuntu)
#   sudo dnf install mpv-libs     (Fedora)
#
# Built on 22.04 deliberately: an AppImage cannot run on a glibc older than
# the one it was compiled against, and 22.04 reaches back far enough to cover
# anything current.

name: Build Linux

on:
  # Dispatch to get an AppImage to try; workflow_call is how the Release
  # workflow asks for one. Never on a push.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp the build with, e.g. 1.1.7"
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        required: true
        type: string

permissions:
  contents: read

jobs:
  appimage:
    # Both architectures a Linux desktop is actually built on, each compiled
    # natively on its own runner.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the version is a version
        env:
          RAW_VERSION: ${{ inputs.version }}
        run: |
          V="$(echo "$RAW_VERSION" | xargs)"
          if ! echo "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "version '$V' is not major.minor.patch" >&2
            exit 1
          fi
          echo "VERSION=$V" >> "$GITHUB_ENV"

      - name: Stamp the version
        run: |
          sed -i "0,/^version = \".*\"/s//version = \"${VERSION}\"/" Cargo.toml
          cargo update --package clicker --precise "${VERSION}" 2>/dev/null || true

      - name: Update Rust
        run: rustup update stable --no-self-update

      # What tray-icon's menu crate and the folder picker compile against, and
      # what FFmpeg needs to offer hardware decoding.
      #
      # Headers, not shipped libraries. libva and libvdpau in particular are
      # deliberately NOT bundled: hardware decoding talks to the machine's own
      # driver, so the machine's own libva has to be the one that loads — the
      # same reason Mesa and libwayland are left alone.
      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxdo-dev libayatana-appindicator3-dev \
            libgl1-mesa-dev pkg-config meson ninja-build nasm \
            libfreetype6-dev libfribidi-dev libharfbuzz-dev libfontconfig1-dev \
            libunibreak-dev python3-setuptools python3-pip autoconf automake libtool \
            libva-dev libvdpau-dev
          # 22.04 ships meson 0.61 and libplacebo wants 0.63 or newer. From
          # pip rather than a newer distribution, because the point of
          # building on 22.04 is its old glibc.
          sudo pip3 install --upgrade meson

      # The staged libmpv, cached whole, keyed on the script where the tags
      # and the licensing flags live — the same arrangement the Windows job
      # uses. Moving either rebuilds from source; everything else reuses it.
      - name: Cache libmpv
        id: mpv
        uses: actions/cache@v4
        with:
          path: third_party
          key: ${{ matrix.arch }}-mpv-${{ hashFiles('scripts/build-mpv.sh') }}

      - name: Build libmpv and FFmpeg (LGPL)
        if: steps.mpv.outputs.cache-hit != 'true'
        run: ./scripts/build-mpv.sh

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ matrix.arch }}-cargo-appimage-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.arch }}-cargo-appimage-

      - name: Build the AppImage
        run: ./scripts/build-appimage.sh

      - name: Upload the AppImage
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage-${{ matrix.arch }}
          path: target/appimage/Clicker-${{ env.VERSION }}-${{ matrix.arch }}.AppImage
          if-no-files-found: error
          retention-days: 30
