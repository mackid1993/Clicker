# SPDX-License-Identifier: MIT
#
# Clicker - an unofficial, native client for Channels DVR
# Copyright (c) 2026 David Brustein
#
# Builds the Flatpak bundle. Manual only, like everything else here. The
# result is uploaded as an artifact — install it with
#
#   flatpak install --user Clicker-<version>-<arch>.flatpak
#
# after installing the ffmpeg-full runtime extension it declares.
#
# There is no Linux machine anywhere in this project, so this workflow is
# both the build and the only compile-and-link proof the Flatpak has. Runtime
# testing happens wherever the .flatpak lands.

name: Build Linux

on:
  # Dispatch to get a bundle to try; workflow_call is how the Release
  # workflow asks for one. Never on a push: this compiles mpv from source.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp the build with, e.g. 1.1.7"
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        required: true
        type: string

permissions:
  contents: read

jobs:
  flatpak:
    # Both architectures a Linux desktop is actually built on. The ARM job is
    # not theatre: a Raspberry Pi or an Ampere box running a television client
    # is exactly the machine this suits, and an x86 bundle will not run on it.
    # Each builds natively on its own runner rather than through emulation,
    # which for something that compiles mpv from source is the difference
    # between six minutes and most of an hour.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the version is a version
        env:
          RAW_VERSION: ${{ inputs.version }}
        run: |
          V="$(echo "$RAW_VERSION" | xargs)"
          if ! echo "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "version '$V' is not major.minor.patch" >&2
            exit 1
          fi
          echo "VERSION=$V" >> "$GITHUB_ENV"

      # Stamped the same way every other platform stamps it, and thrown away
      # with the runner. Cargo.lock is refreshed to match, because the build
      # inside the sandbox runs --locked and would otherwise refuse.
      - name: Stamp the version
        run: |
          sed -i "0,/^version = \".*\"/s//version = \"${VERSION}\"/" Cargo.toml
          cargo update --package clicker --precise "${VERSION}" 2>/dev/null || true

      - name: Install flatpak-builder
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder python3-aiohttp python3-tomlkit

      - name: Add Flathub and install the runtime
        run: |
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
          flatpak install --user -y flathub \
            org.freedesktop.Platform//24.08 \
            org.freedesktop.Sdk//24.08 \
            org.freedesktop.Sdk.Extension.rust-stable//24.08 \
            org.freedesktop.Platform.ffmpeg-full//24.08

      # The build sandbox has no network, so every crate in Cargo.lock is
      # declared as a source first. The generator is fetched pinned rather
      # than from master, so this step cannot change behavior on its own.
      - name: Vendor the cargo dependencies
        run: |
          curl -sfL -o flatpak-cargo-generator.py \
            https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/f03a673abe6ce189cea1c2857e2b44af2dd79d1f/cargo/flatpak-cargo-generator.py
          python3 flatpak-cargo-generator.py Cargo.lock \
            -o packaging/flatpak/generated-sources.json

      # The expensive part is mpv and friends — twenty minutes of compiling —
      # and flatpak-builder caches finished modules keyed on their own
      # sources, so a run that changes nothing about mpv reuses it.
      #
      # A rolling key, not a content hash. Keying on a hash of the manifest
      # looked tidier and cached nothing: every edit to the file — a finish-arg,
      # a comment — produced a new key and therefore a miss, which is most
      # edits, because the manifest is the one file this workflow is about.
      # `github.run_id` never repeats, so the save always happens; the prefix
      # in restore-keys is what actually finds the newest previous cache.
      # flatpak-builder then decides for itself which modules it can reuse,
      # which is the decision it is qualified to make and this key is not.
      - name: Cache flatpak-builder state
        uses: actions/cache@v4
        with:
          path: .flatpak-builder
          key: flatpak-builder-${{ matrix.arch }}-${{ github.run_id }}
          restore-keys: |
            flatpak-builder-${{ matrix.arch }}-

      - name: Build
        run: |
          flatpak-builder --user --force-clean --repo=repo build-dir \
            packaging/flatpak/io.github.mackid1993.Clicker.yml

      - name: Bundle
        run: |
          flatpak build-bundle repo "Clicker-${VERSION}-${{ matrix.arch }}.flatpak" \
            io.github.mackid1993.Clicker

      - name: Upload the bundle
        uses: actions/upload-artifact@v4
        with:
          name: linux-flatpak-${{ matrix.arch }}
          path: Clicker-${{ env.VERSION }}-${{ matrix.arch }}.flatpak
          if-no-files-found: error
          retention-days: 30
