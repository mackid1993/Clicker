# SPDX-License-Identifier: MIT
#
# Clicker - an unofficial, native client for Channels DVR
# Copyright (c) 2026 David Brustein
#
# Compiles the crate on every platform it claims to support. Manual only,
# like the installer build and for the same reason: this exists to be run on
# a branch before the branch is believed, not to spend runner minutes
# re-proving every push.
#
# Three targets, three different reasons:
#   * windows-latest — the platform that already works, which the port must
#     not cost anything; the machine the port is written on cannot compile
#     the cfg(windows) half, so this job is the only thing that can say it
#     still does
#   * macos-14 — Apple silicon, the only Mac architecture supported
#   * ubuntu-latest — the Linux build has no machine of its own anywhere in
#     this project, so this job is its entire compile story
#
# `cargo check` and not `cargo build`: none of these produce an artifact
# anyone runs, and check is the same front half of the compiler at a third
# of the minutes.
#
# It now also runs on a push to main, which it did not at first. The argument
# against was runner minutes, and it was a fair one for every push to every
# branch — but main is where releases are cut from, work lands there directly
# on this project, and a minute and a half of three runners is cheap against
# the alternative, which happened: a day's changes sat on main compiling on
# one platform out of three, and nothing said otherwise until somebody asked.
# Branches are still the dispatch's job.

name: Check

on:
  workflow_dispatch:
  push:
    branches: [main]
    # Not for changes that cannot affect a compile. A README edit spending
    # three runners is the waste the manual-only rule was written against.
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - ".github/workflows/check.yml"

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Update Rust
        run: rustup update stable --no-self-update

      # What tray-icon and its menu crate compile against on Linux. The other
      # platforms get these from the OS.
      - name: Install GTK headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libappindicator3-dev libxdo-dev

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-check-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-check-

      # --locked, so a check can never quietly resolve different dependency
      # versions than the installer build will.
      - name: cargo check
        run: cargo check --locked

  # The two mpv builders pin their own versions — build-mpv.sh in shell for
  # macOS and Linux, build-mpv.ps1 in PowerShell for Windows — and nothing has
  # ever checked that they agree. Unifying them was the obvious fix and the
  # wrong one: the Linux cache fingerprint greps those tags straight out of
  # build-mpv.sh, so moving them somewhere else would leave the cache blind to
  # a version bump and quietly ship a stale player. Verifying the invariant
  # costs seconds and touches nothing that builds.
  players:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The two mpv builders must pin the same versions
        run: |
          sh_mpv=$(sed -n 's/^MPV_TAG="\(.*\)"/\1/p' scripts/build-mpv.sh)
          sh_ff=$(sed -n 's/^FFMPEG_TAG="\(.*\)"/\1/p' scripts/build-mpv.sh)
          ps_mpv=$(sed -n "s/^\$MpvTag = '\(.*\)'/\1/p" scripts/build-mpv.ps1)
          ps_ff=$(sed -n "s/^\$FFmpegTag = '\(.*\)'/\1/p" scripts/build-mpv.ps1)
          echo "shell: mpv $sh_mpv, FFmpeg $sh_ff"
          echo "ps1:   mpv $ps_mpv, FFmpeg $ps_ff"
          for v in "$sh_mpv" "$sh_ff" "$ps_mpv" "$ps_ff"; do
            if [ -z "$v" ]; then
              echo "::error::a version pin could not be read; the builders changed shape" >&2
              exit 1
            fi
          done
          if [ "$sh_mpv" != "$ps_mpv" ] || [ "$sh_ff" != "$ps_ff" ]; then
            echo "::error::the mpv builders disagree — Windows would ship a different player" >&2
            exit 1
          fi
          echo "both builders agree"
