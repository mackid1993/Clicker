# SPDX-License-Identifier: MIT
#
# Clicker - an unofficial, native client for Channels DVR
# Copyright (c) 2026 David Brustein
#
# Builds and signs Clicker.app — universal, both architectures — and uploads
# the zip as an artifact. It publishes nothing: the Release workflow is what
# gathers this and the other platforms into one draft release.
#
# Two builds and a join, rather than one build that cross-compiles. Each
# architecture is compiled by a machine of that architecture — the
# application, its libmpv, its FFmpeg and every library those drag in — and
# `lipo` merges the two bundles at the end. Cross-compiling only the
# application is what shipped before, and it produced a universal executable
# sitting beside arm64-only libraries: an Intel Mac that launches, finds no
# player it can load, and shows an error instead of television.
#
# Notarizing is off unless asked for, and the Release workflow is what asks.
# A build run by hand is for trying something; making it wait on Apple's
# queue — forty seconds on a good night, an hour on a bad one — spends time
# to prove nothing about a build nobody else will open. The signature and
# the hardened runtime are identical either way, so a bug that only shows up
# in a signed app still shows up here.
#
# Manual only, like every workflow here.
#
# Five repository secrets make the signing work
# (Settings → Secrets and variables → Actions):
#
#   MACOS_CERTIFICATE           base64 of the Developer ID Application .p12
#   MACOS_CERTIFICATE_PASSWORD  the password that .p12 was exported with
#   APPLE_ID                    the Apple ID email of the developer account
#   APPLE_TEAM_ID               the 10-character team id on the certificate
#   APPLE_APP_PASSWORD          an app-specific password from appleid.apple.com
#
# The certificate goes into a throwaway keychain that dies with the runner;
# nothing about the identity survives the job.

name: Build macOS

on:
  # Dispatch to get a signed .app to try; workflow_call is how the Release
  # workflow asks for one. Never on a push — signing and notarizing on every
  # commit would spend Apple's queue and a runner to prove what a compile
  # already proves, and the Check workflow is what watches for breakage.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to stamp the build with, e.g. 1.1.7"
        required: true
        type: string
      notarize:
        description: "Notarize (slow — Apple's queue). Off for a build to try."
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      notarize:
        # The Release workflow passes true. A build somebody runs by hand to
        # get something to try does not need Apple's opinion, and Apple's
        # queue has taken an hour on a bad night.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  # What our own code is compiled against — Rust, FFmpeg, mpv. It matches
  # LSMinimumSystemVersion in build-macos.sh.
  #
  # It does not reach Homebrew's libass and libplacebo, which are poured for
  # the runner's own macOS and are therefore the real floor. Building those
  # from source here would settle it; until then the honest statement is that
  # the bundle is tested on current macOS and compiled to run further back.
  MACOSX_DEPLOYMENT_TARGET: "12.0"

jobs:
  build:
    # One job per architecture, each on a machine of that architecture.
    # Nothing cross-compiles: the slice, its libmpv, its FFmpeg and every
    # library they pull in are all built natively, and `lipo` joins the two
    # bundles afterwards in the `universal` job below. Cross-compiling only
    # the application produced a universal binary beside arm64-only
    # libraries — an Intel Mac that launches and cannot load its player.
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-13 was the Intel runner and was retired; macos-15-intel
          # replaces it. macos-14 still works but is deprecated, so both
          # halves sit on 15 and move together.
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Update Rust
        run: rustup update stable --no-self-update

      # libass and libplacebo come from Homebrew rather than from source: both
      # are permissive or LGPL (ISC and LGPL-2.1), so bundling them raises
      # nothing, and building them here would drag in FreeType, HarfBuzz,
      # FriBidi and Fontconfig as well. FFmpeg is the one that has to be ours,
      # because Homebrew's is --enable-gpl.
      - name: Build dependencies
        run: brew install meson ninja nasm pkg-config libass libplacebo

      # The staged libmpv, cached whole, keyed on the script where the tags
      # and the licensing flags live — the same arrangement the Windows job
      # uses.
      # The cache key comes from the pinned versions, not from the whole
      # script.
      #
      # Keyed on the file, every edit to a comment or a check produced a new
      # key and therefore a miss — which meant recompiling FFmpeg and mpv to
      # prove that a comment had changed. What actually determines whether a
      # staged build can be reused is the tags and the configure flags, so
      # that is what the key is made of.
      - name: Work out the libmpv cache key
        id: mpvkey
        run: |
          # The audio options are in here deliberately. They were not, and a
          # cached libmpv with no audio output would have survived the commit
          # that fixed it — the flags changed, the key did not, and CI would
          # have restored the mute build and shipped it again.
          #
          # Comments stripped first. Keyed on the raw file, a sentence that
          # happened to mention -Dgpl=false changed the key and rebuilt
          # FFmpeg and mpv on every runner to prove that a comment had
          # changed. Only the tags and the flags decide whether a staged
          # build can be reused, so only code is hashed.
          FINGERPRINT=$(sed 's/#.*//' scripts/build-mpv.sh \
            | grep -E '^(FFMPEG_TAG|MPV_TAG|LIBASS_TAG|LIBPLACEBO_TAG)=|disable-gpl|Dgpl=|enable-vaapi|enable-videotoolbox|Dalsa=|Dpulse=|Dpipewire=|Dcoreaudio=' \
            | (shasum -a 256 2>/dev/null || sha256sum) | cut -c1-16)
          echo "key=$FINGERPRINT" >> "$GITHUB_OUTPUT"
          echo "libmpv cache fingerprint: $FINGERPRINT"

      - name: Cache libmpv
        id: mpv
        uses: actions/cache@v4
        with:
          path: third_party
          key: macos-${{ matrix.arch }}-mpv-${{ steps.mpvkey.outputs.key }}

      - name: Build libmpv and FFmpeg (LGPL)
        if: steps.mpv.outputs.cache-hit != 'true'
        run: ./scripts/build-mpv.sh

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ matrix.arch }}-cargo-release-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.arch }}-cargo-release-

      - name: Check the version is a version
        env:
          RAW_VERSION: ${{ inputs.version }}
        run: |
          V="$(echo "$RAW_VERSION" | xargs)"
          if ! echo "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "version '$V' is not major.minor.patch" >&2
            exit 1
          fi
          echo "VERSION=$V" >> "$GITHUB_ENV"

      # Stamped the way build.ps1 stamps it, and thrown away with the runner.
      - name: Stamp the version
        run: |
          sed -i '' "s/^version = \".*\"/version = \"${VERSION}\"/" Cargo.toml
          cargo update --package clicker --precise "${VERSION}" 2>/dev/null || true

      - name: Build (unsigned, this architecture only)
        run: ./scripts/build-macos.sh --no-notarize

      # The bundle itself, as a tarball so file modes and symlinks survive
      # the round trip through an artifact.
      - name: Pack the bundle
        run: tar czf "clicker-${{ matrix.arch }}.tar.gz" -C target/macos Clicker.app

      - name: Upload this architecture
        uses: actions/upload-artifact@v4
        with:
          name: macos-slice-${{ matrix.arch }}
          path: clicker-${{ matrix.arch }}.tar.gz
          if-no-files-found: error
          retention-days: 1

  universal:
    needs: build
    runs-on: macos-15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Check the version is a version
        env:
          RAW_VERSION: ${{ inputs.version }}
        run: |
          V="$(echo "$RAW_VERSION" | xargs)"
          if ! echo "$V" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "version '$V' is not major.minor.patch" >&2
            exit 1
          fi
          echo "VERSION=$V" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          pattern: macos-slice-*
          path: slices

      - name: Unpack both architectures
        run: |
          mkdir -p arm64 x86_64
          tar xzf slices/macos-slice-arm64/clicker-arm64.tar.gz -C arm64
          tar xzf slices/macos-slice-x86_64/clicker-x86_64.tar.gz -C x86_64

      - name: Join them
        run: ./scripts/lipo-app.sh arm64/Clicker.app x86_64/Clicker.app Clicker.app

      - name: Import the signing certificate
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERTIFICATE" ]; then
            echo "The MACOS_CERTIFICATE secret is not set; see the header of this workflow." >&2
            exit 1
          fi

          # Newlines are stripped from both secrets before use, because the
          # commonest way to store one is `echo "…" | gh secret set`, and echo
          # appends a newline that becomes part of the value. A password with
          # an invisible trailing newline fails as "MAC verification failed
          # (wrong password?)", which sends people hunting for a typo that
          # isn't there. Only CR and LF are removed; a password is not
          # allowed to contain them anyway.
          PW="$(printf '%s' "$MACOS_CERTIFICATE_PASSWORD" | tr -d '\r\n')"

          KC="$RUNNER_TEMP/build.keychain-db"
          KC_PASS="$(uuidgen)"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          printf '%s' "$MACOS_CERTIFICATE" | tr -d '\r\n' | base64 --decode > "$RUNNER_TEMP/cert.p12"

          if ! security import "$RUNNER_TEMP/cert.p12" -k "$KC" \
               -P "$PW" -T /usr/bin/codesign; then
            echo "::error::Could not import the certificate. 'MAC verification failed' means" >&2
            echo "::error::MACOS_CERTIFICATE_PASSWORD is not the password the .p12 was exported" >&2
            echo "::error::with. Check it locally: openssl pkcs12 -in Certificates.p12 -noout" >&2
            rm -f "$RUNNER_TEMP/cert.p12"
            exit 1
          fi

          security set-key-partition-list -S apple-tool:,apple: -k "$KC_PASS" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" login.keychain-db
          rm "$RUNNER_TEMP/cert.p12"

          # Say which identity arrived, so a wrong-certificate mistake is
          # visible here rather than three steps later at codesign time.
          security find-identity -v -p codesigning "$KC"

      - name: Store notarization credentials
        if: inputs.notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          # Checked here rather than left to Apple, which answers a missing
          # password with "HTTP status code: 401. Invalid credentials" — a
          # message that sends people to check a password they never set.
          for name in APPLE_ID APPLE_TEAM_ID APPLE_APP_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::The $name secret is not set. See the header of this workflow." >&2
              exit 1
            fi
          done

          # Same newline hygiene as the certificate password above.
          xcrun notarytool store-credentials notary \
            --apple-id "$(printf '%s' "$APPLE_ID" | tr -d '\r\n')" \
            --team-id "$(printf '%s' "$APPLE_TEAM_ID" | tr -d '\r\n')" \
            --password "$(printf '%s' "$APPLE_APP_PASSWORD" | tr -d '\r\n')"

      # The script finds the imported identity and the stored profile on its
      # own; CI builds and desk builds go through the identical path.
      - name: Sign, and notarize when asked
        run: |
          IDENTITY=$(security find-identity -v -p codesigning \
            | grep -m1 "Developer ID Application" | sed 's/.*"\(.*\)"/\1/')
          # The certificate's kind, not its holder. A Developer ID common name
          # carries the account holder's own name, and this log is public on
          # every run; the team id beside it is masked as a secret already,
          # which makes printing the name it belongs to the odd one out. What
          # a reader of this log needs is that an identity was found and which
          # kind it is, and that is what is left.
          echo "signing as: ${IDENTITY%% (*}"
          # Inside out: a hardened bundle is only as signed as the code
          # nested in it, and these libraries were rewritten by lipo after
          # their own builds signed them.
          for lib in Clicker.app/Contents/Frameworks/*.dylib; do
            codesign --force --options runtime --timestamp -s "$IDENTITY" "$lib"
          done
          codesign --force --options runtime --timestamp \
            --entitlements packaging/macos/entitlements.plist \
            -s "$IDENTITY" Clicker.app
          codesign --verify --deep --strict --verbose=2 Clicker.app

          ZIP="Clicker-macOS-${VERSION}-universal.zip"
          ditto -c -k --keepParent Clicker.app "$ZIP"

          if [ "${{ inputs.notarize }}" = "true" ]; then
            xcrun notarytool submit "$ZIP" --keychain-profile notary --wait --timeout 30m
            xcrun stapler staple Clicker.app
            ditto -c -k --keepParent Clicker.app "$ZIP"
          else
            echo "not notarized (this run did not ask for it)"
          fi

      - name: Upload the app
        uses: actions/upload-artifact@v4
        with:
          name: macos-app
          path: Clicker-macOS-${{ env.VERSION }}-universal.zip
          if-no-files-found: error
          retention-days: 30
