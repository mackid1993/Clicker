# SPDX-License-Identifier: MIT
#
# Clicker - an unofficial, native client for Channels DVR
# Copyright (c) 2026 David Brustein
#
# The Flatpak. This is the Linux distribution story in one file: the
# freedesktop runtime supplies the desktop plumbing, mpv is built here from
# the same pinned tag and with the same LGPL discipline as the Windows build
# (-Dgpl=false, see scripts/build-mpv.ps1 and licenses/THIRD_PARTY.md), and
# FFmpeg comes from the runtime's own ffmpeg-full extension rather than a
# private copy — the sandbox's ld path swaps it in at launch.
#
# Rust dependencies are vendored through generated-sources.json, which CI
# produces from Cargo.lock with flatpak-cargo-generator; the sandbox has no
# network at build time, which is the point of a lockfile anyway.

app-id: io.github.mackid1993.Clicker
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: clicker

add-extensions:
  org.freedesktop.Platform.ffmpeg-full:
    version: '24.08'
    directory: lib/ffmpeg
    add-ld-path: .

cleanup-commands:
  - mkdir -p /app/lib/ffmpeg

finish-args:
  # A television client: picture, sound, and the network the DVR is on.
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --socket=pulseaudio
  - --device=dri
  # Somewhere to put recordings. Without these the settings screen accepts a
  # download folder and the sandbox silently refuses to write to it, which is
  # the worst kind of failure: the setting looks like it took.
  #
  # Two well-known directories rather than --filesystem=host, because a
  # television client has no business reading someone's entire disk. Anywhere
  # else is reachable through the folder picker: it goes through the desktop's
  # own portal, and a directory chosen there is granted to the sandbox as part
  # of the choosing.
  - --filesystem=xdg-download
  - --filesystem=xdg-videos
  # The pointer.
  #
  # A cursor is not drawn by the compositor over an application's own
  # surface — the application supplies it, by loading a cursor theme. A
  # sandbox with no theme to load supplies nothing, and the pointer simply
  # vanishes the moment it crosses into the window, which looks like the
  # application has hung.
  #
  # So: read-only sight of wherever the host keeps its themes, and an
  # XCURSOR_PATH that lists all of them. Read-only, and icons only — this is
  # the narrowest hole that produces a visible mouse pointer.
  - --filesystem=/usr/share/icons:ro
  - --filesystem=xdg-data/icons:ro
  - --filesystem=~/.icons:ro
  - --env=XCURSOR_PATH=~/.icons:~/.local/share/icons:/usr/share/icons:/run/host/user-share/icons:/run/host/share/icons
  # The folder picker. rfd talks to the desktop's own file chooser through
  # the portal, which lives on the session bus — without the name, Browse
  # opens nothing at all and looks like a dead button. The portal is also
  # what grants the sandbox access to whatever directory gets chosen, which
  # is how a download folder outside the two above ever works.
  - --talk-name=org.freedesktop.portal.Desktop
  - --talk-name=org.freedesktop.portal.FileChooser

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin

modules:
  # Subtitles. mpv will not configure without it, and the runtime does not
  # carry it.
  - name: libass
    buildsystem: autotools
    config-opts:
      - --disable-static
    sources:
      - type: git
        url: https://github.com/libass/libass.git
        tag: 0.17.4

  # mpv's rendering library. OpenGL only, no Vulkan: the application drives
  # mpv through the OpenGL render API and nothing else, so the Vulkan half
  # would be compiled, shipped, and never once called.
  - name: libplacebo
    buildsystem: meson
    config-opts:
      # meson's default here is lib64, which neither pkg-config nor the
      # sandbox's loader searches; mpv then reports libplacebo missing with
      # libplacebo sitting right there.
      - --libdir=lib
      - -Dvulkan=disabled
      - -Dshaderc=disabled
      - -Dglslang=disabled
      - -Ddemos=false
      - -Dtests=false
    sources:
      - type: git
        url: https://code.videolan.org/videolan/libplacebo.git
        tag: v7.349.0

  # The player, as a library. The same tag and the same licensing flags as
  # every other platform: -Dgpl=false is what makes libmpv LGPL, and it is
  # not negotiable here any more than it is in build-mpv.ps1.
  - name: mpv
    buildsystem: meson
    config-opts:
      # Same libdir reasoning as libplacebo: libmpv.so.2 must land where
      # dlopen's search path actually reaches.
      - --libdir=lib
      # Audio, demanded rather than hoped for.
      #
      # meson's default for these is "auto", which means a missing library is
      # not an error — it is an mpv built with no way to make a sound, which
      # then plays video in silence and says nothing about why. `enabled`
      # turns that into a build failure, where it belongs. PulseAudio is the
      # one that matters: it is what the freedesktop runtime provides and
      # what PipeWire answers to through its compatibility socket, which is
      # the socket this Flatpak asks for.
      - -Dpulse=enabled
      - -Dalsa=enabled
      - -Dgpl=false
      - -Dlibmpv=true
      - -Dcplayer=false
      - -Dlua=disabled
      - -Djavascript=disabled
      - -Dmanpage-build=disabled
      - -Dtests=false
    sources:
      - type: git
        url: https://github.com/mpv-player/mpv.git
        tag: v0.41.0

  # Captions are drawn by libass, which is handed a font *name* and nothing
  # else — so the name has to be installed inside the sandbox. The runtime
  # carries no monospaced face, which is why closed captions came out wrong
  # or not at all. DejaVu Sans Mono is the one every Linux desktop has, and
  # it is what the player asks for on this platform.
  - name: dejavu-fonts
    buildsystem: simple
    build-commands:
      - install -Dm644 ttf/DejaVuSansMono.ttf /app/share/fonts/DejaVuSansMono.ttf
      - install -Dm644 ttf/DejaVuSansMono-Bold.ttf /app/share/fonts/DejaVuSansMono-Bold.ttf
      - install -Dm644 LICENSE /app/share/licenses/io.github.mackid1993.Clicker/DejaVu-license.txt
    sources:
      - type: archive
        url: https://github.com/dejavu-fonts/dejavu-fonts/releases/download/version_2_37/dejavu-fonts-ttf-2.37.tar.bz2
        sha256: 7576310b219e04159d35ff61dd4a4ec4cdba4f35c00e002a136f00e96a908b0a
        strip-components: 1

  - name: clicker
    buildsystem: simple
    build-options:
      env:
        CARGO_HOME: /run/build/clicker/cargo
    build-commands:
      - cargo --offline build --release --locked
      - install -Dm755 target/release/clicker /app/bin/clicker
      # The licences, in the place the freedesktop conventions put them.
      #
      # Not optional and not a formality. Clicker's own terms are MIT, which
      # requires its notice to travel with the thing; the icon font compiled
      # into the binary is MIT for the same reason; and mpv, which this
      # manifest builds from source a few modules above, is LGPL-2.1 and
      # obliges a copy of that text as well. The Windows installer has always
      # carried the same four files — this bundle was the one that did not.
      - install -Dm644 LICENSE.md
        /app/share/licenses/io.github.mackid1993.Clicker/LICENSE.md
      - install -Dm644 NOTICE.md
        /app/share/licenses/io.github.mackid1993.Clicker/NOTICE.md
      - install -Dm644 licenses/THIRD_PARTY.md
        /app/share/licenses/io.github.mackid1993.Clicker/THIRD_PARTY.md
      - install -Dm644 licenses/LGPL-2.1.txt
        /app/share/licenses/io.github.mackid1993.Clicker/LGPL-2.1.txt
      - install -Dm644 licenses/FluentSystemIcons-MIT.txt
        /app/share/licenses/io.github.mackid1993.Clicker/FluentSystemIcons-MIT.txt
      - install -Dm644 packaging/flatpak/io.github.mackid1993.Clicker.desktop
        /app/share/applications/io.github.mackid1993.Clicker.desktop
      - install -Dm644 packaging/flatpak/io.github.mackid1993.Clicker.metainfo.xml
        /app/share/metainfo/io.github.mackid1993.Clicker.metainfo.xml
      - install -Dm644 assets/clicker.png
        /app/share/icons/hicolor/512x512/apps/io.github.mackid1993.Clicker.png
    sources:
      - type: dir
        path: ../..
      - generated-sources.json
