[package]
name = "clicker"
version = "1.1.1"
edition = "2021"
description = "A native Windows Unofficial Client for Channels DVR Server"
# PolyForm Noncommercial has no SPDX identifier, so the file is the license of
# record.
license-file = "LICENSE.md"
# crates.io requires that anything published there be usable by anyone for any
# purpose, which a noncommercial license is not. Refusing here means it cannot
# happen by accident.
publish = false

[dependencies]
# UI. Immediate mode suits a guide that redraws constantly, and the OpenGL
# backend is what makes video-as-a-texture possible: the decoded frame and the
# controls drawn over it live in the same render pass, so there is no window
# compositing to fight.
eframe = { version = "0.29", default-features = false, features = [
  # glow, not wgpu, and the video is the whole reason.
  #
  # mpv renders through OpenGL or not at all: its other option is a software
  # renderer that converts every frame on the processor, and with hardware
  # decoding on that means the GPU decodes a frame, hands it back over the bus,
  # the CPU converts it, and it goes back over the bus as a texture. Three
  # crossings per frame. Measured on one 1080p60 recording that was 0.70 of a
  # core; through mpv's OpenGL renderer, where the frame never leaves the GPU,
  # it is 0.08.
  "glow",
  "default_fonts",
] }
egui = "0.29"
egui_extras = { version = "0.29", features = ["image"] }

# Playback is mpv, and it is not in this list. libmpv is loaded by name at
# runtime rather than linked, so there is no crate and no build dependency: see
# src/mpv.rs for the slice of its C API this uses, and scripts/build-mpv.ps1 for
# how the library is built. It handles decode, audio output and timing, which
# is why cpal is no longer here either.

# Channels DVR API
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "fs", "io-util"] }

anyhow = "1"
raw-window-handle = "0.6"

# Artwork decoding. Only the formats the DVR actually serves: posters are JPEG,
# preview frames are JPEG, channel logos are PNG. Pulling in the whole format
# zoo would add compile time and attack surface for nothing.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
tray-icon = { version = "0.24.2", default-features = false }

# The system folder picker, for choosing where downloads and the live buffer
# go. Typing a path is a fine fallback and a poor first offer: it invites
# typos, and the failure it produces arrives later, when a recording is half
# downloaded. On Windows this is the shell's own dialog over IFileDialog, and
# it pulls in windows-sys and nothing else. MIT.
rfd = { version = "0.15", default-features = false }

[build-dependencies]
# Embeds the icon and version information into the executable as Win32
# resources. Without it the .ico only reaches the installer, and the program
# itself shows the generic default in Explorer, the taskbar and Alt+Tab.
winresource = "0.1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_System_Performance",
  "Win32_System_SystemInformation",
  "Win32_UI_WindowsAndMessaging",
  # Sparse files, for recycling the live buffer without moving byte offsets.
  # See timeshift.rs.
  "Win32_System_IO",
  "Win32_System_Ioctl",
  "Win32_Storage_FileSystem",
] }

[profile.release]
opt-level = 3
# Thin LTO rather than full. Full LTO was costing well over a minute of link
# time on every single change for a few percent of runtime, which is the wrong
# trade while the player is still being worked on.
lto = "thin"
codegen-units = 4
strip = true

# For iterating on playback. Optimized enough to decode 1080p60 in real time,
# which an unoptimized build is not: a debug build measured 55.78ms per frame
# upload against 2.31ms, and 17fps decode against 58.
[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3
